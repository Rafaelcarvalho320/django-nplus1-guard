[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-nplus1-guard"
version = "0.1.0"
description = "Catch N+1 queries in Django: middleware for development, pytest plugin for CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rafael Penço de Carvalho", email = "102534725+Rafaelcarvalho320@users.noreply.github.com" }]
keywords = ["django", "orm", "n+1", "performance", "pytest", "sql", "profiling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
]

[project.entry-points.pytest11]
nplus1_guard = "nplus1_guard.pytest_plugin"

[project.urls]
Homepage = "https://github.com/Rafaelcarvalho320/django-nplus1-guard"
Issues = "https://github.com/Rafaelcarvalho320/django-nplus1-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nplus1_guard"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:randomly"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
files = ["src"]

[tool.django-stubs]
django_settings_module = "tests.settings"
